<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhiScribe</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Bibliotheque d'icones, reutilisees par reference. -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-onde" viewBox="0 0 24 24"><path d="M2 12h2M7 6v12M12 3v18M17 7v10M22 12h-2"/></symbol>
  <symbol id="i-cadenas" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-puce" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></symbol>
  <symbol id="i-depot" viewBox="0 0 24 24"><path d="M12 16V4M12 4 7.5 8.5M12 4l4.5 4.5"/><path d="M4 16v2.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V16"/></symbol>
  <symbol id="i-fichier" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-croix" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-coche" viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></symbol>
  <symbol id="i-alerte" viewBox="0 0 24 24"><path d="M12 3.5 1.8 20.5h20.4z"/><path d="M12 10v4.5M12 17.6v.1"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-dossier" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-lecture" viewBox="0 0 24 24"><path d="M6 4.5v15L19.5 12z"/></symbol>
  <symbol id="i-arret" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-livre" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5"/></symbol>
  <symbol id="i-personnes" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20v-1.5A4.5 4.5 0 0 1 7.5 14h3A4.5 4.5 0 0 1 15 18.5V20"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.9M17.5 14h.5a3.5 3.5 0 0 1 3.5 3.5V20"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></symbol>
  <symbol id="i-aide" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.3-2.6 4M12 17.2v.1"/></symbol>
  <symbol id="i-reglages" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></symbol>
  <symbol id="i-horloge" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/></symbol>
  <symbol id="i-corbeille" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12M12 3 8 7M12 3l4 4"/><path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15V3M12 15l-4-4M12 15l4-4"/><path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15"/></symbol>
  <symbol id="i-externe" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
  <symbol id="i-loupe" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-copie" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="12" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-etincelle" viewBox="0 0 24 24"><path d="M12 3.5 13.9 9 19.5 11 13.9 13 12 18.5 10.1 13 4.5 11 10.1 9z"/><path d="M18.5 16.5 19.2 18.3 21 19l-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
  <symbol id="i-crayon" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5l3 3"/></symbol>
  <symbol id="i-reprise" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V10h5.5"/></symbol>
  <symbol id="i-langue" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.2 9.5h17.6M3.2 14.5h17.6"/><path d="M12 3c2.4 2.6 3.6 5.6 3.6 9s-1.2 6.4-3.6 9c-2.4-2.6-3.6-5.6-3.6-9S9.6 5.6 12 3z"/></symbol>
</svg>

<header class="entete">
  <div class="marque">
    <svg class="icone-l icone"><use href="#i-onde"></use></svg>
    <h1>WhiScribe</h1>
    <span class="version" id="version"></span>
  </div>
  <span class="confidentialite" data-i18n-title="ui.entete.local_titre">
    <svg class="icone-s icone"><use href="#i-cadenas"></use></svg>
    <span data-i18n="ui.entete.local"></span>
  </span>
  <span class="veille" id="indic-surveillance" style="display:none" title="">
    <svg class="icone-s icone"><use href="#i-dossier"></use></svg>
    <span id="indic-surveillance-texte"></span>
  </span>
  <span class="pousse"></span>
  <button class="bouton-icone" id="btn-theme"
          data-i18n-title="ui.entete.theme" data-i18n-aria="ui.entete.theme">
    <svg class="icone"><use href="#i-theme"></use></svg>
  </button>
  <button class="bouton-icone" id="btn-aide"
          data-i18n-title="ui.entete.aide" data-i18n-aria="ui.entete.aide">
    <svg class="icone"><use href="#i-aide"></use></svg>
  </button>
</header>

<!-- Mise a jour disponible. Masque tant que rien n'a ete trouve, et rien n'est
     cherche tant que l'utilisateur n'a pas active la verification. -->
<div class="bandeau-maj" id="bandeau-maj" style="display:none">
  <svg class="icone-s icone"><use href="#i-info"></use></svg>
  <span id="bandeau-maj-texte"></span>
  <span class="pousse"></span>
  <button class="bouton" id="btn-maj-page">
    <svg class="icone-s icone"><use href="#i-externe"></use></svg>
    <span data-i18n="ui.maj.voir"></span>
  </button>
  <button class="bouton-icone" id="btn-maj-fermer"
          data-i18n-title="ui.maj.masquer" data-i18n-aria="ui.maj.masquer">
    <svg class="icone"><use href="#i-croix"></use></svg>
  </button>
</div>

<main class="corps">

  <!-- ============================ Colonne principale ==================== -->
  <section class="colonne colonne-principale">

    <!-- Materiel -->
    <div class="carte">
      <div class="materiel" id="materiel-entete" role="button" tabindex="0"
           aria-expanded="false" aria-controls="materiel-detail">
        <svg class="icone puce"><use href="#i-puce"></use></svg>
        <div class="contenu">
          <div class="resume" id="materiel-resume" data-i18n="ui.materiel.analyse"></div>
          <div class="conseil" id="materiel-conseil"></div>
        </div>
        <svg class="icone chevron" id="materiel-chevron"><use href="#i-chevron"></use></svg>
      </div>
      <div class="materiel-detail" id="materiel-detail"></div>
    </div>

    <!-- Depot -->
    <div class="zone-depot" id="zone-depot" role="button" tabindex="0">
      <svg class="icone" style="width:32px;height:32px"><use href="#i-depot"></use></svg>
      <div class="principal" data-i18n="ui.depot.principal"></div>
      <div class="secondaire" data-i18n="ui.depot.secondaire"></div>
      <div class="formats" data-i18n="ui.depot.formats"></div>
    </div>

    <!-- Transcriptions interrompues, proposees a la reprise -->
    <div id="bloc-reprises"></div>

    <!-- File et historique -->
    <div class="carte" style="flex:1;display:flex;flex-direction:column;min-height:220px">
      <div class="onglets" role="tablist">
        <button class="onglet" role="tab" id="onglet-file" aria-selected="true" aria-controls="vue-file">
          <span data-i18n="ui.onglet.file"></span> <span class="compteur" id="compteur-file">0</span>
        </button>
        <button class="onglet" role="tab" id="onglet-historique" aria-selected="false" aria-controls="vue-historique">
          <span data-i18n="ui.onglet.historique"></span> <span class="compteur" id="compteur-historique">0</span>
        </button>
        <span class="pousse"></span>
        <button class="bouton-discret bouton" id="btn-vider" style="margin:4px 6px">
          <svg class="icone-s icone"><use href="#i-corbeille"></use></svg>
          <span data-i18n="ui.bouton.vider"></span>
        </button>
      </div>
      <div class="liste" id="vue-file" role="tabpanel" style="overflow-y:auto;flex:1"></div>
      <div class="liste historique" id="vue-historique" role="tabpanel" style="overflow-y:auto;flex:1;display:none"></div>
    </div>

  </section>

  <!-- ============================== Reglages ============================ -->
  <aside class="colonne colonne-laterale">

    <div class="bloc-reglage">
      <span class="titre-section" data-i18n="ui.section.qualite"></span>
      <div class="presets" id="presets"></div>
      <div id="avertissements" style="margin-top:10px"></div>
    </div>

    <div class="bloc-reglage">
      <span class="titre-section" data-i18n="ui.section.langue_sortie"></span>
      <div class="champ">
        <label for="langue" data-i18n="ui.champ.langue_parlee"></label>
        <select id="langue">
          <option value="fr" data-i18n="ui.langue.fr"></option>
          <option value="en" data-i18n="ui.langue.en"></option>
          <option value="es" data-i18n="ui.langue.es"></option>
          <option value="de" data-i18n="ui.langue.de"></option>
          <option value="it" data-i18n="ui.langue.it"></option>
          <option value="nl" data-i18n="ui.langue.nl"></option>
          <option value="pt" data-i18n="ui.langue.pt"></option>
          <option value="pl" data-i18n="ui.langue.pl"></option>
          <option value="ro" data-i18n="ui.langue.ro"></option>
          <option value="ar" data-i18n="ui.langue.ar"></option>
          <option value="auto" data-i18n="ui.langue.auto"></option>
        </select>
        <span class="aide" id="qualite-langue"></span>
      </div>
      <div class="champ">
        <label for="dossier-sortie" data-i18n="ui.champ.dossier_sortie"></label>
        <div class="ligne-champ">
          <input type="text" id="dossier-sortie" readonly>
          <button class="bouton" id="btn-dossier" data-i18n-title="ui.titre.choisir_dossier">
            <svg class="icone-s icone"><use href="#i-dossier"></use></svg>
          </button>
          <button class="bouton" id="btn-ouvrir-dossier" data-i18n-title="ui.titre.ouvrir_dossier">
            <svg class="icone-s icone"><use href="#i-externe"></use></svg>
          </button>
        </div>
      </div>
      <div class="champ">
        <label for="motif-sortie" data-i18n="ui.champ.motif"></label>
        <input type="text" id="motif-sortie" spellcheck="false" placeholder="{date}-{nom}">
        <span class="aide apercu-motif" id="apercu-motif"></span>
        <span class="aide" data-i18n-html="ui.aide.motif"></span>
      </div>
      <div class="champ">
        <label data-i18n="ui.champ.formats"></label>
        <div class="cases">
          <label class="case"><input type="checkbox" id="fmt-txt" checked> <span data-i18n="ui.format.txt"></span></label>
          <label class="case"><input type="checkbox" id="fmt-srt"> <span data-i18n="ui.format.srt"></span></label>
          <label class="case"><input type="checkbox" id="fmt-vtt"> <span data-i18n="ui.format.vtt"></span></label>
        </div>
        <label class="case" style="margin-top:6px">
          <input type="checkbox" id="fmt-horodatage"> <span data-i18n="ui.format.horodatage"></span>
        </label>
      </div>
    </div>

    <div class="bloc-reglage">
      <span class="titre-section" data-i18n="ui.section.veille"></span>
      <label class="bascule">
        <input type="checkbox" id="opt-surveillance">
        <span class="piste"></span>
        <span>
          <span class="libelle" data-i18n="ui.veille.bascule"></span><br>
          <span class="sous-libelle" id="etat-surveillance"></span>
        </span>
      </label>
      <div id="bloc-surveillance" style="display:none;margin-top:10px">
        <div class="champ">
          <label for="dossier-surveille" data-i18n="ui.veille.champ"></label>
          <div class="ligne-champ">
            <input type="text" id="dossier-surveille" readonly>
            <button class="bouton" id="btn-dossier-surveille" data-i18n-title="ui.titre.choisir_dossier">
              <svg class="icone-s icone"><use href="#i-dossier"></use></svg>
            </button>
            <button class="bouton" id="btn-ouvrir-surveille" data-i18n-title="ui.titre.ouvrir_dossier">
              <svg class="icone-s icone"><use href="#i-externe"></use></svg>
            </button>
          </div>
        </div>
        <button class="bouton bouton-discret" id="btn-oublier-surveilles" style="width:100%">
          <svg class="icone-s icone"><use href="#i-reprise"></use></svg>
          <span data-i18n="ui.veille.reprendre_tout"></span>
        </button>
      </div>
      <span class="aide" data-i18n="ui.aide.veille"></span>
      <div id="retour-surveillance"></div>
    </div>

    <div class="bloc-reglage">
      <span class="titre-section" data-i18n="ui.section.vocabulaire"></span>
      <p class="aide" style="font-size:12.5px;color:var(--texte-doux);margin-bottom:10px"
         data-i18n="ui.aide.vocabulaire"></p>
      <label class="bascule">
        <input type="checkbox" id="opt-glossaire" checked>
        <span class="piste"></span>
        <span>
          <span class="libelle" data-i18n="ui.voc.glossaire"></span><br>
          <span class="sous-libelle" id="etat-glossaire">--</span>
        </span>
      </label>
      <label class="bascule">
        <input type="checkbox" id="opt-corrections" checked>
        <span class="piste"></span>
        <span>
          <span class="libelle" data-i18n="ui.voc.corrections"></span><br>
          <span class="sous-libelle" id="etat-corrections">--</span>
        </span>
      </label>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="bouton" id="btn-glossaire" style="flex:1">
          <svg class="icone-s icone"><use href="#i-livre"></use></svg>
          <span data-i18n="ui.bouton.glossaire"></span>
        </button>
        <button class="bouton" id="btn-corrections" style="flex:1">
          <svg class="icone-s icone"><use href="#i-reglages"></use></svg>
          <span data-i18n="ui.bouton.corrections"></span>
        </button>
      </div>
    </div>

    <div class="bloc-reglage">
      <span class="titre-section" data-i18n="ui.section.relecture"></span>
      <p class="aide" style="font-size:12.5px;color:var(--texte-doux);margin-bottom:10px"
         data-i18n="ui.aide.relecture"></p>
      <label class="bascule">
        <input type="checkbox" id="opt-compagnon" checked>
        <span class="piste"></span>
        <span>
          <span class="libelle" data-i18n="ui.relecture.compagnon"></span><br>
          <span class="sous-libelle" data-i18n="ui.relecture.compagnon_aide"></span>
        </span>
      </label>
      <label class="bascule">
        <input type="checkbox" id="opt-apprises" checked>
        <span class="piste"></span>
        <span>
          <span class="libelle" data-i18n="ui.relecture.apprises"></span><br>
          <span class="sous-libelle" data-i18n="ui.relecture.apprises_aide"></span>
        </span>
      </label>
      <label class="bascule">
        <input type="checkbox" id="opt-sauvegarde" checked>
        <span class="piste"></span>
        <span>
          <span class="libelle" data-i18n="ui.relecture.sauvegarde"></span><br>
          <span class="sous-libelle" data-i18n="ui.relecture.sauvegarde_aide"></span>
        </span>
      </label>
      <label class="bascule">
        <input type="checkbox" id="opt-lecture-audio">
        <span class="piste"></span>
        <span>
          <span class="libelle" data-i18n="ui.relecture.audio"></span><br>
          <span class="sous-libelle" data-i18n="ui.relecture.audio_aide"></span>
        </span>
      </label>
      <button class="bouton" id="btn-gabarit" style="width:100%;margin-top:10px">
        <svg class="icone-s icone"><use href="#i-etincelle"></use></svg>
        <span data-i18n="ui.bouton.gabarit"></span>
      </button>
      <span class="aide" data-i18n="ui.aide.gabarit"></span>
    </div>

    <div class="bloc-reglage">
      <span class="titre-section" data-i18n="ui.section.locuteurs"></span>
      <label class="bascule">
        <input type="checkbox" id="opt-diarisation">
        <span class="piste"></span>
        <span>
          <span class="libelle" data-i18n="ui.loc.bascule"></span><br>
          <span class="sous-libelle" id="etat-diarisation">--</span>
        </span>
      </label>
      <div id="bloc-locuteurs" style="display:none;margin-top:10px">
        <div class="champ">
          <label for="nb-locuteurs" data-i18n="ui.loc.nombre"></label>
          <select id="nb-locuteurs">
            <option value="0" data-i18n="ui.loc.auto"></option>
            <option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option>
            <option value="6">6</option><option value="7">7</option>
            <option value="8">8</option><option value="10">10</option>
          </select>
          <span class="aide" data-i18n="ui.aide.locuteurs"></span>
        </div>
      </div>
      <button class="bouton" id="btn-jeton" style="width:100%;margin-top:8px">
        <svg class="icone-s icone"><use href="#i-personnes"></use></svg>
        <span id="libelle-jeton"></span>
      </button>
    </div>

    <div class="bloc-reglage">
      <span class="titre-section" data-i18n="ui.section.modeles"></span>
      <div class="sous-libelle" id="etat-modeles">--</div>
      <div class="chemin-modeles" id="chemin-modeles" title="">--</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="bouton" id="btn-dossier-modeles" style="flex:1">
          <svg class="icone-s icone"><use href="#i-dossier"></use></svg>
          <span data-i18n="ui.bouton.changer"></span>
        </button>
        <button class="bouton" id="btn-ouvrir-modeles" data-i18n-title="ui.titre.ouvrir_dossier">
          <svg class="icone-s icone"><use href="#i-externe"></use></svg>
        </button>
      </div>
      <button class="bouton" id="btn-stockage" style="width:100%;margin-top:8px">
        <svg class="icone-s icone"><use href="#i-loupe"></use></svg>
        <span data-i18n="ui.bouton.stockage"></span>
      </button>
      <span class="aide" id="aide-modeles"></span>
      <div id="retour-modeles"></div>
    </div>

    <div class="bloc-reglage">
      <span class="titre-section" data-i18n="ui.section.donnees"></span>
      <div class="sous-libelle" data-i18n="ui.donnees.etat"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="bouton" id="btn-exporter-donnees" style="flex:1">
          <svg class="icone-s icone"><use href="#i-export"></use></svg>
          <span data-i18n="ui.bouton.exporter"></span>
        </button>
        <button class="bouton" id="btn-importer-donnees" style="flex:1">
          <svg class="icone-s icone"><use href="#i-import"></use></svg>
          <span data-i18n="ui.bouton.importer"></span>
        </button>
      </div>
      <span class="aide" data-i18n="ui.aide.donnees"></span>
      <div id="retour-donnees"></div>
    </div>

    <div class="bloc-reglage">
      <span class="titre-section" data-i18n="ui.section.application"></span>

      <!-- Langue de l'interface. Sans rapport avec la langue parlee choisie
           plus haut : celle-ci pilote le moteur, celle-la l'affichage. -->
      <div class="champ">
